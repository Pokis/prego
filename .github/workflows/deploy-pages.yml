name: Deploy clinically approved site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_public_release:
        description: Confirm that clinical approval and public release are authorized
        required: true
        type: boolean
        default: false

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ inputs.confirm_public_release }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and content schemas
        run: npm run check
      - name: Run unit tests
        run: npm run test
      - name: Enforce clinical release gate and build
        run: npm run build:release
      - name: Audit GitHub Pages artifact
        run: npm run audit:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: ${{ inputs.confirm_public_release }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
